```html
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUNAAIRA AI Voice Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #10172a, #173b55);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      text-align: center;
      background: #ffffff12;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      box-shadow: 0 15px 45px #0004;
    }
    h1 { color: #55e6e0; margin-bottom: 8px; }
    .subtitle { color: #d1d9e6; }
    select, textarea, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    select, textarea {
      background: #f7fafc;
      color: #172033;
      border: none;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      cursor: pointer;
      border: none;
      font-weight: bold;
      background: #55e6e0;
      color: #102030;
    }
    button.secondary { background: #e2e8f0; }
    button.stop { background: #ffb4b4; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .panel {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #00000025;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .label { color: #55e6e0; font-weight: bold; }
    #status { color: #ffe59b; }
    .hint { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🎙️ SUNAAIRA AI</h1>
    <p class="subtitle">Your Personal Voice Assistant</p>

    <select id="language" aria-label="Language">
      <option value="en-IN">English</option>
      <option value="hi-IN">हिंदी</option>
    </select>

    <button id="start">🎤 Start Listening</button>
    <button id="stop" class="stop" disabled>⏹ Stop Listening</button>

    <p class="hint">
      Start Listening दबाकर माइक्रोफोन की अनुमति दें। फिर बोलें:
      “Hey Sunaaira, what is your name?”
    </p>

    <textarea id="question" placeholder="अपना सवाल लिखें या बोलें..."></textarea>
    <button id="send">Ask SUNAAIRA AI</button>
    <button id="speak" class="secondary">🔊 Speak Answer Again</button>

    <div class="panel">
      <div class="label">Status</div>
      <p id="status" role="status">SUNAAIRA AI Ready!</p>
    </div>

    <div class="panel">
      <div class="label">AI Answer</div>
      <p id="reply">नमस्ते! मैं SUNAAIRA AI हूँ। मुझसे कुछ भी पूछें।</p>
    </div>
  </main>

  <script>
    const WORKER_URL =
      "https://sunaaira-ai.onlineshopping8776.workers.dev/";

    const question = document.getElementById("question");
    const reply = document.getElementById("reply");
    const status = document.getElementById("status");
    const language = document.getElementById("language");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");

    let recognition = null;
    let listening = false;
    let speaking = false;
    let lastCommandTime = 0;

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        status.textContent = "Voice output is not supported in this browser.";
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language.value;
      utterance.rate = 1;

      utterance.onstart = () => { speaking = true; };
      utterance.onend = () => {
        speaking = false;
        if (listening && recognition) {
          try { recognition.start(); } catch (_) {}
        }
      };
      utterance.onerror = () => { speaking = false; };

      window.speechSynthesis.speak(utterance);
    }

    async function answer() {
      const message = question.value.trim();
      if (!message) {
        status.textContent = "Please type or say your question.";
        return;
      }

      status.textContent = "SUNAAIRA AI is thinking...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "AI request failed.");
        }

        const result = data.answer || "AI reply nahi mila.";
        reply.textContent = result;
        status.textContent = "Answer ready!";
        speak(result);
      } catch (error) {
        status.textContent =
          "Connection error. Internet aur AI service check karein.";
        console.error(error);
      }
    }

    function startListening() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        status.textContent =
          "Voice recognition available nahi hai. Updated Chrome try karein.";
        return;
      }

      if (listening) return;

      listening = true;
      startButton.disabled = true;
      stopButton.disabled = false;

      recognition = new SpeechRecognition();
      recognition.lang = language.value;
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        status.textContent = 'Listening... "Hey Sunaaira" boliye.';
      };

      recognition.onresult = event => {
        const now = Date.now();

        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (!event.results[i].isFinal) continue;

          const heard = event.results[i][0].transcript.trim();
          const normalized = heard.toLowerCase();

          const wakePattern =
            /\bhey\s+suna+\s*aira\b|\bhey\s+sunaira\b|\bsunaaira\b|\bsunaira\b/i;

          const match = normalized.match(wakePattern);

          if (!match) continue;
          if (now - lastCommandTime < 2500) continue;

          lastCommandTime = now;

          const command = heard
            .replace(wakePattern, "")
            .replace(/^[\s,.:!?-]+/, "")
            .trim();

          if (!command) {
            status.textContent = "Ji, boliye! Main SUNAAIRA AI hoon.";
            speak("Ji, boliye! Main SUNAAIRA AI hoon.");
            continue;
          }

          question.value = command;
          recognition.stop();
          answer();
          return;
        }
      };

      recognition.onerror = event => {
        if (event.error === "not-allowed" ||
            event.error === "service-not-allowed") {
          status.textContent =
            "Microphone permission allow karein.";
          listening = false;
          startButton.disabled = false;
          stopButton.disabled = true;
        } else if (event.error !== "no-speech" &&
                   event.error !== "aborted") {
          status.textContent = "Microphone error: " + event.error;
        }
      };

      recognition.onend = () => {
        if (listening && !speaking) {
          setTimeout(() => {
            if (listening && recognition && !speaking) {
              try { recognition.start(); } catch (_) {}
            }
          }, 500);
        }
      };

      try {
        recognition.start();
      } catch (error) {
        status.textContent = "Mic start nahi hua. Dobara try karein.";
      }
    }

    function stopListening() {
      listening = false;
      if (recognition) {
        recognition.onend = null;
        recognition.stop();
        recognition = null;
      }

      startButton.disabled = false;
      stopButton.disabled = true;
      status.textContent = "Listening stopped.";
    }

    startButton.addEventListener("click", startListening);
    stopButton.addEventListener("click", stopListening);
    document.getElementById("send").addEventListener("click", answer);

    question.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        answer();
      }
    });

    document.getElementById("speak").addEventListener("click", () => {
      speak(reply.textContent);
    });

    language.addEventListener("change", () => {
      if (listening) {
        stopListening();
        status.textContent =
          "Language changed. Start Listening dobara dabayein.";
      }
    });
  </script>
</body>
</html>
